name: CI (Go)

on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "mise.toml", ".github/workflows/ci-go.yml"]
  pull_request:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "mise.toml", ".github/workflows/ci-go.yml"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: golangci-lint
        run: mise exec -- golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: Run tests
        # -race requires cgo. mise.toml pins CGO_ENABLED=0 and `mise exec`
        # re-applies it over job env, so the override must run INSIDE the
        # mise environment. Release builds stay cgo-free via goreleaser.
        run: mise exec -- env CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      # >>> kit-managed: toolchain >>>
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise run install
      # <<< kit-managed: toolchain <<<

      - name: Build
        run: mise exec -- go build -o evol .
