# evol loop configuration — copy to evol.yaml and bind your adapters.
#
# Every port is an external executable spoken to over stdio (see spec/).
# cmd is an argv array; the engine appends nothing — flags belong here.
# env is an optional per-port map of adapter settings; a variable set
# in the engine's process environment overrides the same key here.

# Default artifact to evolve; `evol run --artifact <ref>` overrides.
# Omit entirely to let `evol run --select never-run|worst|stale|drift|kb-churn`
# pick a target from the store's artifacts and their corpus history.
artifact: skills/commit-style

ports:
  artifactstore:
    cmd: [evol-adapter-artifact-fs]
    timeout_seconds: 30
  generator:
    cmd: [evol-adapter-generator-llm]
    timeout_seconds: 300
  executor:
    cmd: [evol-adapter-executor-apx]
    timeout_seconds: 600
  corpus:
    cmd: [evol-adapter-corpus-fs]
    timeout_seconds: 30
    # Adapter settings may live in config instead of exported env;
    # the process environment wins on key collision.
    # env:
    #   EVOL_CORPUS_ROOT: .evol/corpus
  # Scores transcripts against cases (spec/port-scorer.md).
  scorer:
    cmd: [evol-adapter-scorer-eva]
    timeout_seconds: 120
  # casegen (optional): the generator-port `synth` action for grounded
  # synthetic case generation (`evol cases synth`). Cases always land
  # quarantined; promote after review.
  # casegen:
  #   cmd: ["evol-adapter-casegen-llm"]
  #   timeout_seconds: 300

  # Optional: leave cmd out (or empty) to run without a knowledge base.
  knowledgebase:
    cmd: [evol-adapter-kb-ctxt]
    timeout_seconds: 30

# Optional: the run ledger (spec/port-audit.md). One entry per loop
# run — outcome, metrics, one step per generation; read back with
# `evol runs list` / `evol runs show <id>`. audit-tlc keeps the ledger
# in the family tracker (project-scoped, next to task and flow
# history); audit-fs is the zero-dependency JSONL fallback.
#  audit:
#    cmd: ["evol-adapter-audit-tlc"]        # or ["evol-adapter-audit-fs"] with EVOL_AUDIT_ROOT
#    timeout_seconds: 30

thresholds:
  # Candidate holdout mean must reach baseline + delta to be promoted.
  delta: 0.05
  # Runs per case; scores average across trials.
  trials: 1
  # Paired-bootstrap significance the gate also requires (p <= sig_level)
  # when at least 8 paired cases exist; below that floor the gate is
  # mean-only and says so on stderr. sig_seed makes p reproducible.
  # sig_level: 0.05
  # sig_seed: 1

budget:
  generations: 3
  max_candidates: 3

# Corpus split used for gating.
holdout: holdout

# Sent to the executor as the wire-level env.mode hint:
# replay | record | live.
executor_mode: replay

# Optional: model/provider URI forwarded as env.provider on every executor
# run. The run wrapper interprets it — e.g. claude://haiku selects the model
# for a claude-CLI wrapper; ollama://llama3.2:3b?base_url=http://127.0.0.1:11434
# targets a local Ollama server.
# executor_provider: claude://haiku

# Optional: model-dimension sweep. The FIRST entry is the primary
# provider — the gate compares candidate vs baseline under it alone;
# every other entry is scored per candidate and recorded to the corpus
# as evidence rows (verdict "evidence", provider attributed) for
# routing decisions. Overrides executor_provider.
# executor_providers:
#   - claude://haiku
#   - ollama://llama3.2:3b?base_url=http://127.0.0.1:11500

# Optional: recorded-environment location (e.g. the executor's cassette
# root). When set, the promoted candidate's corpus record carries it as
# fixtures.cassette_dir for regression replay.
# fixtures_dir: .evol/cassettes

# Promotion plumbing (docs/promotion.md):
# - Git-native versioning: run the artifact-fs adapter with
#   EVOL_ARTIFACT_GIT=1 and an artifact root inside a git work tree;
#   every promotion becomes a commit, `evol rollback` restores prior
#   versions as forward commits.
# - Post-promotion hook: operator argv run after a successful
#   promotion (EVOL_PROMOTED_REF / _VERSION / _GIT_COMMIT in env);
#   non-zero exit warns, never fails the promotion. Releases stay a
#   separate, operator-gated act.
# promotion:
#   hook: ["./scripts/on-promote.sh"]

# Optional: routing write-back. After sweep runs, `evol routing emit`
# aggregates per-provider evidence from the corpus and hands it to the
# routing adapter, which writes a kit-llm pool fragment (weights =
# normalized per-provider holdout means). The pool file is itself a
# tool-config artifact the loop can evolve. Adapter argv resolves from
# --adapter, then EVOL_ROUTING_CMD, then ["routing-emit"] on PATH.
# See docs/routing-writeback.md.

# Self-scheduling: run the loop on a schedule and let a policy pick the
# target from recorded evidence (docs/self-scheduling.md):
#   evol run --config evol.yaml --select drift      # chase score decline
#   evol run --config evol.yaml --select kb-churn   # spread attention
